name: Browser tests

# Reports only: it does not gate the deploy, because a few tests are timing-sensitive.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: PW_CHROME="$(node -p "require('playwright-core').chromium.executablePath()")" npm test
