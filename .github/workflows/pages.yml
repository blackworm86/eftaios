name: Deploy to GitHub Pages
on:
  push:
    branches: [main, ccr-6928b416-rtom29]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build
        run: node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8'));v.build=process.env.GITHUB_SHA.slice(0,7);v.built=new Date().toISOString().slice(0,10);fs.writeFileSync('version.json',JSON.stringify(v))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
