<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<title>EFTAIOS Companion</title>
<meta name="description" content="Companion app for the physical board game Escape from the Aliens in Outer Space. Tracks your secret route, turns and announcements. No cards included.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<!-- SETUP -->
<main id="flow" class="screen" hidden><div class="setup-card" id="flow-card"></div></main>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand" aria-hidden="true">EFTAIOS</div>
    <div class="stat" aria-live="polite"><small data-i18n="Turn">Turn</small><b id="hd-turn">1</b><i>/39</i></div>
    <div id="hd-role" class="chip"></div>
    <div class="pos stat"><small data-i18n="Sector">Sector</small><b id="hd-pos">—</b></div>
    <button id="hide-btn" class="icon-btn" data-act="hide" data-i18n-aria="Hide screen" aria-label="Hide screen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg>
    </button>
  </header>
  <div id="turnbar" class="turnbar" role="status" hidden></div>

  <div id="layout">
    <section id="stage" class="stage" aria-label="Map">
      <svg id="map" role="img" aria-label="Hex map of the space station"></svg>
      <div id="inspect" class="inspect" hidden></div>
      <div class="zoom">
        <button data-act="zin" data-i18n-aria="Zoom in" aria-label="Zoom in">+</button>
        <button data-act="zout" data-i18n-aria="Zoom out" aria-label="Zoom out">−</button>
        <button data-act="fit" data-i18n-aria="Fit map to screen" aria-label="Fit map to screen">⤢</button>
        <button data-act="focus" data-i18n-aria="Center on my position" aria-label="Center on my position">◎</button>
      </div>
    </section>

    <aside id="panel" class="panel">
      <div id="panel-body"></div>
    </aside>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="play" data-i18n="Play">Play</button>
    <button role="tab" data-tab="table" data-i18n="Table">Table</button>
    <button role="tab" data-tab="more" data-i18n="More">More</button>
  </nav>
</div>

<div id="cover" class="cover" hidden>
  <div>
    <div class="cover-ico">⬢</div>
    <h2 data-i18n="Screen hidden">Screen hidden</h2>
    <p data-i18n="Nobody can see your position.">Nobody can see your position.</p>
    <button class="btn primary" data-act="unhide" data-i18n="Show screen">Show screen</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>

<script src="firebase-config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="game.js"></script>
<script src="online.js"></script>
<script src="flow.js"></script>
</body>
</html>
