<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.gstatic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<title>EFTAIOS Companion</title>
<meta name="description" content="Companion app for the physical board game Escape from the Aliens in Outer Space. Tracks your secret route, turns and announcements. No cards included.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SETUP -->
<main id="flow" class="screen" hidden><div class="setup-card" id="flow-card"></div></main>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand" aria-hidden="true">EFTAIOS</div>
    <div class="stat" aria-live="polite"><small data-i18n="Turn">Turn</small><b id="hd-turn">1</b><i>/40</i></div>
    <div id="hd-role" class="chip"></div>
    <div class="pos stat"><small data-i18n="Sector">Sector</small><b id="hd-pos">—</b></div>
    <button id="hide-btn" class="icon-btn" data-act="hide" data-i18n-aria="Hide screen" aria-label="Hide screen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg>
    </button>
  </header>
  <div id="turnbar" class="turnbar" role="status" hidden></div>

  <div id="layout">
    <section id="stage" class="stage" aria-label="Map">
      <div id="mapwrap"><svg id="map" role="img" aria-label="Hex map of the space station"></svg></div>
      <div id="inspect" class="inspect" hidden></div>
      <div id="mkbar" class="mkbar" role="group" aria-label="Show one player" hidden></div>
      <div id="annotbar" class="annotbar" hidden></div>
      <div id="annbar" class="annbar" aria-live="polite"></div>
      <div id="followbar" class="followbar" role="status" hidden></div>
      <div class="zoom">
        <button data-act="zin" data-i18n-aria="Zoom in" aria-label="Zoom in" class="zb"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button data-act="zout" data-i18n-aria="Zoom out" aria-label="Zoom out" class="zb"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button data-act="fit" data-i18n-aria="Fit map to screen" aria-label="Fit map to screen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button data-act="focus" data-i18n-aria="Center on my position" aria-label="Center on my position"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button data-act="routes" data-i18n-aria="Show the routes" aria-label="Show the routes" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 17c5-1 3-9 9-10"/><path d="M13.5 5.5L16.5 7l-1.6 2.8"/></svg></button>
        <button data-act="annot" data-i18n-aria="Stamps and drawings" aria-label="Stamps and drawings" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h4"/></svg></button>
      </div>
    </section>

    <aside id="panel" class="panel">
      <div id="panel-body"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="play" data-i18n="Play">Play</button>
        <button role="tab" data-tab="table" data-i18n="Table">Table</button>
        <button role="tab" data-tab="more" data-i18n="More">More</button>
      </nav>
    </aside>
  </div>

</div>

<div id="cover" class="cover" hidden>
  <div>
    <svg class="cover-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10l5 8.5-5 8.5H7L2 12z"/></svg>
    <h2 data-i18n="Screen hidden">Screen hidden</h2>
    <p data-i18n="Nobody can see your position.">Nobody can see your position.</p>
    <button class="btn primary" data-act="unhide" data-i18n="Show screen">Show screen</button>
  </div>
</div>

<div id="pass" class="cover pass" role="dialog" aria-modal="true" hidden></div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<footer id="ver" class="ver" aria-hidden="true"></footer>
<div id="botthink" class="botthink" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>

<script src="firebase-config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="gicons.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="game.js"></script>
<script src="online.js"></script>
<script src="bot.js"></script>
<script src="hot.js"></script>
<script src="mapman.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="flow.js"></script>
</body>
</html>
